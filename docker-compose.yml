services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventpulse}
      POSTGRES_USER: ${POSTGRES_USER:-eventpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventpulse}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Disposable Redis dedicated to integration tests. It intentionally has no
  # volume: rate-limit keys must not survive a container recreation.
  redis-test:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_TEST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

volumes:
  postgres_data:
